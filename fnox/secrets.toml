# Secrets. Always `env = "exec"`: tasks run through `fnox exec` and mise grants
# (`#MISE secrets=[...]` in a task) receive them, but your shell (fnox activate),
# agents' shells and `fnox export` never do. Store real values through a
# provider, never as a plain `default`:
#
#   fnox provider add keychain keychain
#   fnox set NAME --provider keychain
#
# A mise grant also redacts the value in that task's output; see
# .mise/tasks/examples/secret.

[secrets]
# Example only, NOT a secret: a plain default so it works without setup.
EXAMPLE_TOKEN = { default = "example-not-a-real-secret", env = "exec", description = "Example: shows how a task receives a secret" }
