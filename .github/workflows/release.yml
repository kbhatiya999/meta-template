name: Release

# Release harbor and the template together, without picking a version:
#   gh workflow run release.yml
# The version is today's date, vYYYY.M.D, with .1, .2 … for extra releases the
# same day, so it always increases (and sorts above the old v2.0.0 tags).
# Each harbor release renders the template tag with its own version.
# One-time setup for PyPI: add this repo + workflow (environment "pypi") as a
# trusted publisher for harbor-meta.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next date version
        id: v
        run: |
          base=$(date -u +%Y.%-m.%-d)
          v=$base; n=0
          while git rev-parse -q --verify "refs/tags/v$v" >/dev/null; do n=$((n+1)); v="$base.$n"; done
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"
          gh release create "v${{ steps.v.outputs.version }}" --generate-notes

  pypi:
    needs: tag
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}

      - uses: astral-sh/setup-uv@v5

      - name: Set version
        run: sed -i 's/^version = .*/version = "${{ needs.tag.outputs.version }}"/' pyproject.toml

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1
