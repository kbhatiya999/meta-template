name: Release

# Push a tag like v0.2.0 to publish everywhere:
#   Go     -> proxy.golang.org (via the tag itself) + binaries on the GitHub release
#   PyPI   -> harbor-meta        (trusted publishing; add this repo + workflow as a publisher on PyPI)
#   npm    -> @kbhatiya999/harbor (needs the NPM_TOKEN repo secret)
# The tag is the single source of truth for the version.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  go:
    name: Go binaries + release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/}
            EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o "dist/harbor-${GOOS}-${GOARCH}${EXT}" .
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Warm the Go module proxy
        run: GOPROXY=https://proxy.golang.org GO111MODULE=on go list -m "github.com/${{ github.repository }}@${{ github.ref_name }}"

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set version from tag
        run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
