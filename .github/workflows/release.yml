name: Release

# Release harbor and the template together:
#   1. describe the changes under "## [Unreleased]" in CHANGELOG.md and push
#   2. gh workflow run release.yml
#
# The version is today's date, YYYY.M.D, with .1, .2 … for further releases the
# same day, so it always increases. The job publishes to PyPI first and only then
# commits the changelog, tags and creates the GitHub release, so a failed publish
# leaves nothing behind. Each harbor release renders the template tag with its
# own version.
#
# One-time setup: a PyPI trusted publisher for harbor-meta with this repo,
# workflow release.yml and environment pypi.
#
# Dry run (on GitHub, or locally with `mise run release-dry-run`): version,
# changelog and build only. Under act (ACT=true) it is always a dry run, so a
# local run can never publish, push or release.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the version, cut the changelog and build, but publish, push and release nothing
        type: boolean
        default: false

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Next date version
        id: v
        run: |
          base=$(date -u +%Y.%-m.%-d)
          v=$base; n=0
          while git rev-parse -q --verify "refs/tags/v$v" >/dev/null; do n=$((n+1)); v="$base.$n"; done
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cut the changelog entry
        run: python3 .github/scripts/changelog.py "${{ steps.v.outputs.version }}" "$RUNNER_TEMP/notes.md" "${{ github.repository }}"

      - name: Build
        env:
          # hatch-vcs would derive a .dev version: the tag doesn't exist until publishing succeeds
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.v.outputs.version }}
        run: uv build

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run && !env.ACT }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Commit changelog, tag, create GitHub release
        if: ${{ !inputs.dry_run && !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Release v$V"
          git tag "v$V"
          git push origin HEAD:main "v$V"
          gh release create "v$V" --title "harbor $V" --notes-file "$RUNNER_TEMP/notes.md" dist/*

      - name: Dry run result
        if: ${{ inputs.dry_run || env.ACT }}
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          echo "Would release v$V (nothing was published, pushed or released)"
          ls dist
          echo "--- release notes ---"
          cat "$RUNNER_TEMP/notes.md"
