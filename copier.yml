_subdirectory: template

# Files that are yours once created: the template seeds them, never updates them,
# so `copier update` / `harbor sync` can't conflict with your edits. `keep` adds
# template-managed files to that list (harbor adopt records the ones a repo
# already had).
_skip_if_exists:
  - mani.yaml
  - README.md
  - .gitignore
  - .ignore
  - fnox.toml
  - "{% if 'mise.toml' in keep %}mise.toml{% endif %}"
  - "{% if 'AGENTS.md' in keep %}AGENTS.md{% endif %}"
  - "{% if 'CLAUDE.md' in keep %}CLAUDE.md{% endif %}"

_message_after_copy: |
  Meta repo "{{ repo_name }}" created.

  Next steps:
    mise install       # install pinned tools
    mise run sync      # clone sub-repos, update .gitignore AND .ignore
    mise run hello     # verify task runner

  Use `mise run sync` rather than `mani sync` — mani only updates .gitignore.

# A meta repo is a container: its job is to HOLD other repos. The only thing it
# needs to know about itself is where it lives — owner/repo — which becomes its
# self-entry URL in mani.yaml and the `git remote add origin` in the README.
# The repos it holds carry their own owners/URLs, added per-project in mani.yaml.
github_slug:
  type: str
  help: "owner/repo where THIS meta repo lives (e.g. kbhatiya999/kn-courses-meta)"
  placeholder: "owner/repo"
  validator: >-
    {% if not (github_slug | regex_search('^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$')) %}
    Must be owner/repo, e.g. kbhatiya999/kn-courses-meta
    {% endif %}

# Derived from the slug — never asked, but recorded and usable in templates.
owner:
  type: str
  when: false
  default: "{{ github_slug.split('/')[0] }}"

repo_name:
  type: str
  when: false
  default: "{{ github_slug.split('/')[1] }}"

description:
  type: str
  help: Short description of what this meta repo tracks
  default: "{{ repo_name }} meta repo"

use_fnox:
  type: bool
  help: Include fnox for secret/env management?
  default: true

keep:
  type: yaml
  help: "Template-managed files that stay yours (any of mise.toml, AGENTS.md, CLAUDE.md)"
  default: []
