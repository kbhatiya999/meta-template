[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "harbor-meta"
dynamic = ["version"]
description = "One tree of meta repos per GitHub account; every repo cloned exactly once"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["meta repo", "multi-repo", "mani", "copier", "mise", "git"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "copier>=9",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://kbhatiya999.github.io/meta-template/"
Documentation = "https://kbhatiya999.github.io/meta-template/"
Changelog = "https://github.com/kbhatiya999/meta-template/blob/main/CHANGELOG.md"
Repository = "https://github.com/kbhatiya999/meta-template"
Issues = "https://github.com/kbhatiya999/meta-template/issues"
Releases = "https://github.com/kbhatiya999/meta-template/releases"

[project.scripts]
harbor = "harbor.main:main"
harbor-meta = "harbor.main:main"  # so `uvx harbor-meta` works without --from

[dependency-groups]
docs = ["mkdocs-material>=9.5", "mkdocs>=1.6,<2"]  # MkDocs 2 drops plugin/theme support Material needs

# The version comes from git: exactly the tag on a release (2026.10.11.2), and
# <last tag>.postN.devM+g<hash> between releases, so a local install always says
# which release it builds on. CI sets the release version explicitly.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.hatch.build.targets.wheel]
packages = ["src/harbor"]
