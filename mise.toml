# Tools and settings only. Tasks are script files, one per task, in two folders
# mise loads together:
#
#   mise-tasks/     the shared toolkit (tilt:*, env), from template/mise-tasks/
#   .mise/tasks/    this repo's own tasks; a same-named task here overrides the toolkit's
#
#   mise run tilt:up    every task as a button in this repo's Tilt dashboard
#   mise run dev        install this checkout as your own copy of the tool
#   mise run test       end-to-end tests
#   mise run env        every value tasks see, and where it comes from
#   mise tasks          list everything
#
# Values, plain config and secrets alike, live in fnox (fnox.toml and the files
# it imports; your machine's overrides in fnox.local.toml), never in your shell.
# mise only picks the fnox flavour: FNOX_PROFILE in mise.local.toml.

min_version = "2026.10.4"  # task `secrets` (mise's fnox integration)

[settings]
experimental = true        # needed for [secrets.fnox], this project only

[secrets.fnox]

[tools]
uv = "latest"
tilt = "latest"
act = "latest"
fnox = "latest"
